name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# No job gets a token scope it doesn't ask for. The publish job takes id-token
# (OIDC, for Trusted Publishing); the build jobs need nothing at all.
permissions: {}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: cibuildwheel --output-dir dist
        env:
          CIBW_SKIP: "pp* *musllinux*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    # Trusted Publishing: PyPI mints a short-lived token from this job's OIDC
    # identity, so there's no API token to store or rotate. PyPI checks the claim
    # against the publisher registered for the project — owner/repo, this
    # workflow's filename, and the environment below must all match there.
    environment:
      name: pypi
      url: https://pypi.org/p/nnsight
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Pinned to the commit behind v1.14.2: this is the one step in the repo that
      # can publish, so it doesn't track a moving branch.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
