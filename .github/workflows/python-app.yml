# Install the package and run the test suite on CPU.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    # Development happens on the release branch, so it has to be listed here or
    # nothing tests it: a `pull_request` run only ever tests the PR head, never
    # the merge that lands it, and never a commit pushed straight to the branch.
    branches: ["main", "0.8"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Every version `pyproject.toml` advertises. A single job cannot see a
      # break that only one interpreter has: #698 was exactly that -- PEP 649
      # gives every `def` an extra `__annotate__` symtable child on 3.14, which
      # silently disabled the payload scope filter, and the two tests that
      # covered it were failing on 3.14 while CI stayed green.
      #
      # 3.10, 3.11 and 3.13 were previously left out rather than guessed at.
      # The suite has now been run on each, one worktree, torch 2.14.0 and
      # transformers 5.17.0 throughout, `--ignore=tests/vllm --ignore=tests/tp`:
      #
      #   3.10.21   1057 passed, 13 skipped, 1 xfailed, 0 failed
      #   3.11.15   1060 passed, 10 skipped, 1 xfailed, 0 failed
      #   3.13.12   1060 passed, 10 skipped, 1 xfailed, 0 failed
      #   3.14.3    1060 passed, 10 skipped, 1 xfailed, 0 failed
      #
      # 3.10 runs three fewer because of the `same_line_lambdas` skip in
      # test_serialization.py -- same-signature lambdas on one line need
      # `code.co_positions`, which is 3.11+. That is the only difference, and
      # it is already declared in the test. 3.10 is the advertised floor and
      # had never been exercised before this.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Many tests pull small models from the HuggingFace Hub on first run; cache
      # them so reruns don't re-download. Keyed by the test files so it refreshes
      # when the set of models a test touches changes.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # The any-to-any test's checkpoint has an audio modality, and its
      # pipeline requires librosa at construction even for a text/image-only
      # call. librosa needs numba, which trails new Python releases, so it
      # can't sit in the dev extra without breaking the newest matrix leg;
      # install it where numba exists and let the test importorskip elsewhere.
      - name: Install audio extras
        if: matrix.python-version == '3.12'
        run: pip install librosa

      # CPU only (the runner has no GPU); skip the vLLM suite, which needs a GPU
      # and the vllm extra.
      #
      # `tests/tp` is no longer ignored. Its GPU tests skip themselves on a
      # runner with no cards (`pytestmark = skipif(device_count() < 2)`), and
      # what is left is `test_cpu_gloo.py`, which shards a tiny model across two
      # CPU ranks over gloo in a few seconds. Ignoring the whole directory is why
      # transformers 5.16 could move its tensor-parallel plan off the modules and
      # leave nnsight's TP path silently inert with CI green.
      - name: Run tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/ -q --ignore=tests/vllm
