[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nnsight"
dynamic = ["version"]
description = "Interpreting and manipulating the internals of neural networks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaden Fiotto-Kaufman", email = "JadenFK@outlook.com" }]
keywords = ["deep learning", "neural networks", "interpretability", "pytorch", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core: tracing, interleaving, config, serialization.
    "torch",
    "greenlet",
    "pydantic",
    "pyyaml",
    "cloudpickle",
    # HuggingFace models (TransformersModel, tokenizers, hub access).
    "transformers",
    "huggingface-hub",
    # Remote execution on NDIF.
    "websocket-client",
    "zstandard",
    "httpx",
    "tqdm",
]

[project.optional-dependencies]
# Everything the test suite needs on top of the core install.
dev = [
    "pytest",
    "pillow",
    "diffusers",
    "accelerate",
]
# High-throughput / tensor-parallel serving (needs a CUDA GPU).
vllm = [
    "vllm",
    "triton",
]
# Running an nnsight model server (the nnsight-serve entry point): the vLLM
# engine plus the HTTP server deps.
serve = [
    "nnsight[vllm]",
    "fastapi",
    "uvicorn",
]

[project.scripts]
nnsight = "nnsight.login:main"
nnsight-serve = "nnsight.modeling.vllm.serve.cli:main"

[project.urls]
Homepage = "https://github.com/ndif-team/nnsight"
Website = "https://nnsight.net/"
Documentation = "https://nnsight.net/documentation/"
Repository = "https://github.com/ndif-team/nnsight.git"
"Bug Tracker" = "https://github.com/ndif-team/nnsight/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nnsight = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Version is derived from the git tag at build time (e.g. tag `v0.8.0` -> `0.8.0`);
# between tags it's the next dev version. fallback_version is used only when there's
# no git metadata and no sdist PKG-INFO to read (e.g. a bare source copy).
[tool.setuptools_scm]
fallback_version = "0.8.0"
