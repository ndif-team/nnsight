# Shipped baseline config. Do NOT edit in place (it lives in site-packages and
# is overwritten on upgrade). Override via ~/.config/nnsight/config.yaml, a file
# pointed to by $NNSIGHT_CONFIG, or environment variables (NDIF_HOST,
# NDIF_API_KEY). Precedence: this file < user file < environment.
API:
  HOST: https://api.ndif.us
  APIKEY: null
  COMPRESS: true
APP:
  DEBUG: false
  REMOTE_LOGGING: true
  # Mount .save() on every object so `value.save()` works (else use
  # `nnsight.save(value)`). Adds `.save` to all objects process-wide.
  PYMOUNT: true
